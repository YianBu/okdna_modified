name: Build Launcher

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:

    runs-on: windows-latest

    env:
      PYTHONIOENCODING: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set UTF-8 encoding
        run: |
          set PYTHONIOENCODING=utf-8
          set PYTHONLEGACYWINDOWSSTDIO=utf-8
          echo PYTHONIOENCODING=utf-8 >> $GITHUB_ENV

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: inline_ok_requirements
        run: |
          python -m ok.update.inline_ok_requirements --tag ${{ github.ref_name }}

      - name: Run tests
        run: |
          Get-ChildItem -Path ".\tests\*test*.py" | ForEach-Object {
              Write-Host "Running tests in $($_.FullName)"
              python -m unittest $_.FullName
          }

      - name: Build with PyAppify Action
        id: build-app
        uses: ok-oldking/pyappify-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          build_exe_only: false
          # 复用已编译的独立 Launcher，跳过耗时最长的 Rust/Tauri 编译。
          # 目标 release 必须是已公开发布的：action 拿它的 browser_download_url 下资产，
          # draft 的这个地址取不到（v1.0.2 第一次构建就是栽在这），所以
          # launcher-base-v1.0.1 已作为预发布公开。改过 icons/ 或 pyappify.yml 之后
          # 这个 zip 会失效，需要重新产出一个 launcher 包并更新下面的 tag。
          use_release: https://api.github.com/repos/${{ github.repository }}/releases/tags/launcher-base-v1.0.1

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: |
            ## ok-dna-mod 完整安装包

            * [ok-dna-mod-win32-China-setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ok-dna-mod-win32-China-setup.exe) - 完整安装包

            下载后双击运行，按照安装器提示完成安装即可。
          draft: false
          prerelease: false
          make_latest: true
          files: pyappify_dist/ok-dna-mod-win32-China-setup.exe
