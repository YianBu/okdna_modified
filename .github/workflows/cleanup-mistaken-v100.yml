name: Cleanup mistaken v1.0.0 release

on:
  push:
    paths:
      - '.github/workflows/cleanup-mistaken-v100.yml'
  workflow_run:
    workflows:
      - Build
      - Build Launcher
    types: [requested, in_progress, completed]

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel v1.0.0 builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/runs/36153850219/cancel" || true
          gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/runs/36152827799/cancel" || true
      - name: Delete mistaken v1.0.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --repo "$GITHUB_REPOSITORY" --yes || true
